<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login — Habit Cost Handler</title>
    
    <!-- PWA Settings -->
    <meta name="theme-color" content="#f8fafc">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="./manifest.json">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Outfit:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="./src/css/style.css">
    <link rel="stylesheet" href="./src/css/auth.css">
</head>
<body>
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="site-title"><em>Habit</em> Cost Handler</h1>
                <p class="site-subtitle" id="authSubtitle">Sign in to sync your data</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active-form">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="you@example.com" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <div class="auth-error" id="loginError"></div>
                <button type="submit" class="btn-calculate btn-auth" id="loginBtn">
                    <span>Login</span>
                </button>
                <p class="auth-switch">Don't have an account? <button type="button" class="btn-link" id="showSignup">Sign up</button></p>
            </form>

            <!-- Signup Form -->
            <form id="signupForm" class="auth-form">
                <div class="input-group">
                    <label>Name</label>
                    <input type="text" id="signupName" placeholder="Your Name" required>
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="signupEmail" placeholder="you@example.com" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="signupPassword" placeholder="Minimum 6 characters" required minlength="6">
                </div>
                <div class="auth-error" id="signupError"></div>
                <button type="submit" class="btn-calculate btn-auth" id="signupBtn">
                    <span>Create Account</span>
                </button>
                <p class="auth-switch">Already have an account? <button type="button" class="btn-link" id="showLogin">Login</button></p>
            </form>
        </div>
    </main>

    <script type="module" src="./src/js/auth.js"></script>
</body>
</html>
